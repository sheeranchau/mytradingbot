<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trading Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            background: #0a0e17;
            color: #e1e4e8;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 32px;
            width: 380px;
        }
        .login-title {
            font-size: 18px;
            font-weight: 600;
            color: #58a6ff;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 12px;
            color: #8b949e;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e1e4e8;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1f6feb;
            background: #1f6feb;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-login:hover { background: #388bfd; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            margin-top: 12px;
            padding: 8px 12px;
            background: #3d1a1a;
            border: 1px solid #f8717144;
            color: #f87171;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }
        .error-msg.visible { display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">Trading Dashboard</div>
        <div class="login-subtitle">Sign in to continue</div>

        <!-- Password form -->
        <div id="password-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" value="joshzhou" readonly
                    style="color:#58a6ff; background:#0d1117; cursor:default;" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password"
                    onkeydown="if(event.key==='Enter') doLogin()" autofocus />
            </div>
            <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In</button>
        </div>

        <!-- 2FA form (shown after password OK) -->
        <div id="totp-form" class="hidden">
            <div class="form-group">
                <label>2FA Code</label>
                <input type="text" id="totp-code" placeholder="Enter 6-digit code"
                    maxlength="6" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code"
                    onkeydown="if(event.key==='Enter') doLogin2FA()" />
            </div>
            <button class="btn-login" onclick="doLogin2FA()">Verify</button>
        </div>

        <div class="error-msg" id="error-msg"></div>
    </div>

    <script>
        let savedPassword = '';

        async function doLogin() {
            const password = document.getElementById('password').value;
            if (!password) return;

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            hideError();

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await resp.json();

                if (resp.ok && data.requires_2fa) {
                    savedPassword = password;
                    document.getElementById('password-form').classList.add('hidden');
                    document.getElementById('totp-form').classList.remove('hidden');
                    document.getElementById('totp-code').focus();
                    return;
                }

                if (resp.ok) {
                    window.location.href = '/';
                    return;
                }

                showError(data.detail || 'Login failed');
            } catch (e) {
                showError('Network error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function doLogin2FA() {
            const code = document.getElementById('totp-code').value.trim();
            if (!code) return;
            hideError();

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: savedPassword, totp_code: code }),
                });
                const data = await resp.json();

                if (resp.ok) {
                    window.location.href = '/';
                    return;
                }
                showError(data.detail || 'Invalid code');
            } catch (e) {
                showError('Network error');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error-msg').classList.remove('visible');
        }
    </script>
</body>
</html>
